name: 🚀 Odyssey para Windows

# Builds the Odyssey engine (our fork of PCSX2) and packs it inside the Electron launcher.
# The result is the "Odyssey-Windows" artifact: an installer and a portable .exe.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # The engine only needs rebuilding when its own code changes. Its cache key is a hash of every
  # top-level folder except odyssey/ (the launcher) and .github/, plus the two engine build workflows.
  check:
    name: "Motor: precisa compilar?"
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Engine cache key
        id: key
        run: |
          trees=$(git ls-tree HEAD | grep -vP '\t(odyssey|\.github)$')
          flows=$(sha256sum .github/workflows/windows_build_qt.yml .github/workflows/windows_deps_build.yml)
          hash=$(printf '%s\n%s' "$trees" "$flows" | sha256sum | cut -c1-20)
          echo "key=odyssey-engine-sse4-$hash" >> "$GITHUB_OUTPUT"
          echo "Engine key: odyssey-engine-sse4-$hash"

      - name: Look for a saved engine
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: odyssey/engine
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
          enableCrossOsArchive: true

  engine_deps:
    name: "Motor: dependências"
    needs: check
    if: needs.check.outputs.hit != 'true'
    uses: ./.github/workflows/windows_deps_build.yml

  engine:
    name: "Motor"
    needs: [check, engine_deps]
    if: needs.check.outputs.hit != 'true'
    uses: ./.github/workflows/windows_build_qt.yml
    with:
      jobName: "Odyssey Engine (SSE4)"
      artifactPrefixName: "Odyssey-engine"
      configuration: Release
      # SSE4 runs on every Intel/AMD CPU from the last ~15 years.
      simd: "SSE4"
    secrets: inherit

  launcher:
    name: "Launcher Electron"
    needs: [check, engine]
    # Runs after a fresh engine build, or straight away when the saved engine is still valid.
    if: always() && needs.check.result == 'success' && (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    runs-on: windows-latest
    # Needed to publish the GitHub Release that the auto-updater reads.
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: odyssey
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use the saved engine
        if: needs.check.outputs.hit == 'true'
        uses: actions/cache/restore@v4
        with:
          path: odyssey/engine
          key: ${{ needs.check.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Download engine build
        if: needs.check.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: Odyssey-engine-*
          path: odyssey/_engine_artifacts

      - name: Place engine inside the launcher
        if: needs.check.outputs.hit != 'true'
        shell: pwsh
        run: |
          $dir = Get-ChildItem _engine_artifacts -Directory | Where-Object { $_.Name -notlike '*-symbols' } | Select-Object -First 1
          if (-not $dir) { throw "Engine artifact not found" }
          Write-Host "Engine artifact: $($dir.Name)"
          New-Item -ItemType Directory -Force engine | Out-Null
          # The artifact name has [brackets], which PowerShell treats as wildcards in -Path.
          # Piping the items binds them by LiteralPath, so the copy works.
          Get-ChildItem -LiteralPath $dir.FullName | Copy-Item -Destination engine -Recurse -Force
          $exe = Get-ChildItem engine -File | Where-Object { $_.Name -like 'pcsx2-qt*.exe' } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Recurse engine | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }
            throw "Engine executable missing from odyssey/engine"
          }
          if (-not (Test-Path -LiteralPath (Join-Path engine 'resources\GameIndex.yaml'))) { throw "GameIndex.yaml missing from the engine" }
          Write-Host "Engine: $($exe.Name)"

      - name: Save the engine for the next builds
        if: needs.check.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: odyssey/engine
          key: ${{ needs.check.outputs.key }}
          enableCrossOsArchive: true

      - name: Check engine
        shell: pwsh
        run: |
          $exe = Get-ChildItem engine -File | Where-Object { $_.Name -like 'pcsx2-qt*.exe' } | Select-Object -First 1
          if (-not $exe) { throw "Engine executable missing from odyssey/engine" }
          Write-Host "Engine: $($exe.Name)"

      - name: Download the Dreamcast engine (Flycast)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Official Flycast release for Windows x64 (GPL v2, source at github.com/flyinghead/flycast).
        run: |
          $rel = gh release view --repo flyinghead/flycast --json tagName,assets | ConvertFrom-Json
          Write-Host "Flycast $($rel.tagName)"
          $rel.assets | ForEach-Object { Write-Host "  asset: $($_.name)" }
          $asset = $rel.assets | Where-Object { $_.name -match '\.zip$' -and $_.name -match 'win' -and $_.name -notmatch 'libretro|arm|uwp|x86\b|i686|win32' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows x64 Flycast build in release $($rel.tagName)" }
          gh release download $rel.tagName --repo flyinghead/flycast --pattern $asset.name --dir _flycast
          Expand-Archive -LiteralPath (Join-Path _flycast $asset.name) -DestinationPath _flycast/x -Force
          $exe = Get-ChildItem _flycast/x -Recurse -Filter flycast.exe | Select-Object -First 1
          if (-not $exe) { throw "flycast.exe not found in $($asset.name)" }
          New-Item -ItemType Directory -Force engines/flycast | Out-Null
          Copy-Item -LiteralPath $exe.FullName engines/flycast/flycast.exe
          Set-Content engines/flycast/VERSION.txt "$($rel.tagName) ($($asset.name))"
          Write-Host "Flycast: $($exe.Length) bytes"

      - name: Download the PS4 engine (shadPS4)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Official shadPS4 release for Windows x64 (GPL v2, source at github.com/shadps4-emu/shadPS4).
        run: |
          $rel = gh release view --repo shadps4-emu/shadPS4 --json tagName,assets | ConvertFrom-Json
          Write-Host "shadPS4 $($rel.tagName)"
          $rel.assets | ForEach-Object { Write-Host "  asset: $($_.name)" }
          $asset = $rel.assets | Where-Object { $_.name -match '\.zip$' -and $_.name -match 'win' -and $_.name -notmatch 'qt|arm|pdb|symbols' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows shadPS4 build in release $($rel.tagName)" }
          gh release download $rel.tagName --repo shadps4-emu/shadPS4 --pattern $asset.name --dir _shadps4
          Expand-Archive -LiteralPath (Join-Path _shadps4 $asset.name) -DestinationPath _shadps4/x -Force
          $exe = Get-ChildItem _shadps4/x -Recurse -Filter shadPS4.exe | Select-Object -First 1
          if (-not $exe) { throw "shadPS4.exe not found in $($asset.name)" }
          New-Item -ItemType Directory -Force engines/shadps4 | Out-Null
          Get-ChildItem -LiteralPath $exe.DirectoryName | Copy-Item -Destination engines/shadps4 -Recurse -Force
          Set-Content engines/shadps4/VERSION.txt "$($rel.tagName) ($($asset.name))"
          Get-ChildItem engines/shadps4 | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Install launcher dependencies
        run: npm install --no-audit --no-fund

      - name: Test ISO reader
        run: npm test

      - name: Set version
        shell: pwsh
        # Every build gets a higher version (0.2.<build number>), so installed copies see it as an update.
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build and publish Odyssey
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --publish always

      - name: Upload Odyssey
        uses: actions/upload-artifact@v4
        with:
          name: Odyssey-Windows
          path: |
            odyssey/dist/*.exe
            odyssey/dist/latest.yml
